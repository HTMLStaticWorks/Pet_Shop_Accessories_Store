<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pet Shop | Page Not Found </title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <style>
    .notfound-hero {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 80px 24px;
      background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
      position: relative;
      overflow: hidden;
    }

    /* Radial color spot accents */
    .notfound-hero::before {
      content: '';
      position: absolute;
      top: -10%;
      right: -10%;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .notfound-hero::after {
      content: '';
      position: absolute;
      bottom: -10%;
      left: -10%;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .notfound-card {
      text-align: center;
      max-width: 580px;
      width: 100%;
      padding: 60px 40px;
      border-radius: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow-hover);
      position: relative;
      z-index: 1;
    }

    .notfound-card h1 {
      font-size: 110px;
      font-weight: 800;
      line-height: 1;
      margin: 0 0 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .notfound-card h2 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .notfound-card p {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .notfound-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    @media (max-width:600px) {
      .notfound-card {
        padding: 40px 24px;
      }
      .notfound-card h1 {
        font-size: 80px;
      }
      .notfound-card h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="theme-rtl-controls">
    <button class="theme-toggle" aria-label="Toggle Theme"></button>
    <button class="rtl-toggle" aria-label="Toggle Layout Direction">RTL</button>
  </div>

  <section class="notfound-hero">
    <div class="notfound-card">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 80px; height: 80px; border-radius: 50%; background: rgba(20, 184, 166, 0.1); color: var(--primary); margin-bottom: 24px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M16 16s-1.5-2-4-2-4-2-4-2"/>
          <line x1="9" y1="9" x2="9.01" y2="9"/>
          <line x1="15" y1="9" x2="15.01" y2="9"/>
        </svg>
      </div>
      <h1>404</h1>
      <h2>Oops! We lost the scent</h2>
      <p>We couldn't find the page you were looking for. It might have wandered off or been moved.</p>

      <div class="notfound-actions">
        <a href="index.html" class="btn btn-primary">Go Home</a>
        <a href="contact.html" class="btn btn-secondary">Contact Us</a>
        <a href="coming-soon.html" class="btn btn-secondary">See Coming Soon</a>
      </div>
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
