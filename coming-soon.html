<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pet Shop | Coming Soon</title>
  <meta name="description" content="Feature coming soon">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <style>
    .coming-hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 80px 24px;
      background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
      position: relative;
      overflow: hidden;
    }

    /* Radial color spot accents */
    .coming-hero::before {
      content: '';
      position: absolute;
      top: -10%;
      right: -10%;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .coming-hero::after {
      content: '';
      position: absolute;
      bottom: -10%;
      left: -10%;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .coming-card {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 48px;
      align-items: center;
      padding: 60px;
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--card-shadow-hover);
      border: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .coming-card h1 {
      font-size: 42px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .coming-card p {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .notify-form {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .notify-form .form-control {
      padding: 14px 18px;
      border-radius: 40px;
    }

    .notify-form .btn {
      padding: 14px 28px;
      border-radius: 40px;
    }

    .illustration {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      box-shadow: var(--card-shadow);
    }

    @media (max-width: 880px) {
      .coming-card {
        grid-template-columns: 1fr;
        padding: 40px 24px;
        gap: 32px;
      }
      .illustration {
        height: 200px;
      }
    }
  </style>
</head>

<body>
  <div class="theme-rtl-controls">
    <button class="theme-toggle" aria-label="Toggle Theme"></button>
    <button class="rtl-toggle" aria-label="Toggle Layout Direction">RTL</button>
    <a href="signup.html" class="signup-btn">Sign Up</a>
  </div>

  <section class="coming-hero">
    <div class="coming-card">
      <div>
        <h1>We're launching something paw-some</h1>
        <p>Sign up to be the first to know when we go live - exclusive early access and subscriber perks.</p>

        <form class="notify-form" onsubmit="event.preventDefault(); alert('Thanks - you\'ll be notified!');">
          <input class="form-control" type="email" placeholder="Your email address" required>
          <button class="btn btn-primary" type="submit">Notify Me</button>
        </form>

        <div style="margin-top:24px; display:flex; gap:12px;">
          <a href="index.html" class="btn btn-secondary" style="padding: 10px 24px;">Return Home</a>
          <a href="contact.html" class="btn btn-primary" style="padding: 10px 24px;">Contact Us</a>
        </div>
      </div>

      <div class="illustration" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 24 24" fill="white">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35zM9 9c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm6 0c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm-3-2c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0 5c-1.1 0-2 .9-2 2 0 1.5 2 3 2 3s2-1.5 2-3c0-1.1-.9-2-2-2z"/>
        </svg>
      </div>
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
